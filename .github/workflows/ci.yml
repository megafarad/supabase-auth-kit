name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: GitHub Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The integration suites skip themselves when the database is unreachable, so without a
      # real stack CI would go green having never exercised the SQL the whole model lives in.
      - name: Start local Supabase stack
        run: npx supabase start --workdir apps/installer -x studio,imgproxy,edge-runtime,logflare,vector

      # Fail loudly here rather than letting the suites skip: a reachable database whose
      # bootstrap migration has not run would still produce a green, meaningless test run.
      - name: Verify the authz schema migrated
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -tAc "select count(*) from authz.tenants where parent_id is null" | grep -qx 1

      # The local stack's keys, for the supabase-js suites. Read from the stack rather than written
      # here, so secret scanning never has to judge whether a key is only a local one.
      - name: Export the local stack's API keys
        run: |
          status=$(npx supabase status --workdir apps/installer -o json | sed -n '/^{/,$p')
          secret=$(echo "$status" | jq -r .SECRET_KEY)
          publishable=$(echo "$status" | jq -r .PUBLISHABLE_KEY)
          echo "::add-mask::$secret"
          echo "AUTHZ_TEST_SUPABASE_SECRET_KEY=$secret" >> "$GITHUB_ENV"
          echo "AUTHZ_TEST_SUPABASE_PUBLISHABLE_KEY=$publishable" >> "$GITHUB_ENV"

      # Likewise for the supabase-js transport, whose suites skip when the API is unreachable or
      # does not expose authz.
      - name: Verify authz is callable through the API
        run: |
          curl -fsS -X POST http://127.0.0.1:54321/rest/v1/rpc/has_scope \
            -H "apikey: $AUTHZ_TEST_SUPABASE_SECRET_KEY" \
            -H "Content-Profile: authz" -H "Content-Type: application/json" \
            -d '{"p_principal_id":null,"p_tenant_id":null,"p_scope":"ci"}' | grep -qx false

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          AUTHZ_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          AUTHZ_TEST_SUPABASE_URL: http://127.0.0.1:54321

      - name: Supabase logs
        if: failure()
        run: npx supabase status --workdir apps/installer || true
